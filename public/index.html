<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>SourceBox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23fb6530'/%3E%3Cpath d='M9 12h5l2 2.4h7v9.6H9z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('av.theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4.2l2 2.4h8.8A1.5 1.5 0 0 1 21 9.9v8.6a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11m0 0 4-4m-4 4-4-4M4 17v2.5h16V17"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="17.5" cy="6" r="2.6"/><circle cx="6.5" cy="12" r="2.6"/><circle cx="17.5" cy="18" r="2.6"/><path d="m9 10.7 6-3.4M9 13.3l6 3.4"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <!-- Star is drawn with fill:none like its neighbours; the "on" state swaps
       in fill:currentColor via CSS so a starred item reads as solid. -->
  <symbol id="i-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3.6l2.6 5.3 5.8.85-4.2 4.1 1 5.8-5.2-2.73-5.2 2.73 1-5.8-4.2-4.1 5.8-.85z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.2V12l3.2 1.9"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3.5 21 8l-9 4.5L3 8z"/><path d="M3.4 12.4 12 16.7l8.6-4.3"/></symbol>
  <symbol id="i-keyboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="2.6" y="6.2" width="18.8" height="11.6" rx="2.2"/><path d="M6.4 9.8h.01M9.6 9.8h.01M12.8 9.8h.01M16 9.8h.01M6.4 13h.01M9.6 13h.01M12.8 13h.01M16 13h.01M8.4 15.8h7.2"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v4.5h-4.5"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5v-11m0 0 4 4m-4-4-4 4M4 7V4.5h16V7"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 6.5h15M9.5 6.5V4.6h5v1.9M6.5 6.5 7.4 20h9.2l.9-13.5"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 5.5h-9a2 2 0 0 0-2 2v9"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M6 3.5h7L18.5 9v11.5h-12.5z"/><path d="M13 3.5V9h5.5"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10-6.5z"/></symbol>
  <symbol id="i-git" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5.5" r="2.3"/><circle cx="7" cy="18.5" r="2.3"/><circle cx="17.5" cy="9" r="2.3"/><path d="M7 7.8v8.4M17.5 11.3v.7a4 4 0 0 1-4 4H7"/></symbol>
  <symbol id="i-cloud-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 17.5a4 4 0 0 1-.4-8A5 5 0 0 1 17 9.6a3.9 3.9 0 0 1 .4 7.8"/><path d="M12 11v7.5m0 0 2.6-2.6M12 18.5l-2.6-2.6"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></symbol>
</defs></svg>

<!-- ============================================================ lock -->
<div id="lock">
  <form class="lock-card" id="lock-form">
    <div class="lock-mark"><svg width="22" height="22"><use href="#i-lock"/></svg></div>
    <h1 id="lock-title">SourceBox</h1>
    <p id="lock-sub">Enter your passcode to continue.</p>
    <div class="pass-row">
      <input type="password" id="lock-pass" placeholder="Passcode" autocomplete="current-password" autofocus>
      <button class="btn btn-primary" type="submit" id="lock-go">Open</button>
    </div>
    <div class="msg" id="lock-msg"></div>
    <p class="lock-alt" id="lock-alt">Have an account? <a href="/product#account">Sign in with your email</a></p>
  </form>
</div>

<!-- ============================================================ app -->
<div id="app" class="hidden">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg width="16" height="16"><use href="#i-folder"/></svg></div>
      <div style="min-width:0">
        <div class="brand-name" id="vault-name">SourceBox</div>
        <div class="brand-sub" id="vault-sub">Loading</div>
      </div>
    </div>

    <div class="side-scroll">
      <div class="scopes" id="scopes"></div>

      <div id="proj-section">
        <div class="side-head">
          <span>Projects</span>
          <button class="btn btn-ghost btn-sm owner-only" id="btn-projects" title="Manage projects">
            <svg width="13" height="13"><use href="#i-plus"/></svg>
          </button>
        </div>
        <div id="proj-list"></div>
      </div>

      <div id="git-strip" class="hidden"></div>
    </div>

    <div class="stat-line" id="stats"></div>
    <div class="side-foot">
      <button class="btn btn-sm owner-only" id="btn-upload"><svg width="13" height="13"><use href="#i-upload"/></svg> Upload</button>
      <button class="btn btn-sm owner-only" id="btn-rescan"><svg width="13" height="13"><use href="#i-refresh"/></svg> Rescan</button>
      <button class="btn btn-sm owner-only" id="btn-shares"><svg width="13" height="13"><use href="#i-share"/></svg> Links</button>
      <button class="btn btn-sm btn-icon" id="btn-keys" title="Keyboard shortcuts (?)"><svg width="14" height="14"><use href="#i-keyboard"/></svg></button>
      <button class="btn btn-sm btn-icon" id="btn-theme" title="Light / dark"><svg width="14" height="14"><use href="#i-sun"/></svg></button>
      <button class="btn btn-sm btn-icon owner-only" id="btn-settings" title="Settings"><svg width="14" height="14"><use href="#i-gear"/></svg></button>
    </div>
  </aside>

  <main id="main">
    <div class="topbar">
      <button class="btn btn-ghost btn-icon" id="menu-btn"><svg width="18" height="18"><use href="#i-menu"/></svg></button>
      <div class="search-wrap">
        <svg class="lead" width="16" height="16"><use href="#i-search"/></svg>
        <input type="search" id="q" placeholder="Search in plain language — logo, invoice pdf, product photo…" autocomplete="off" spellcheck="false">
        <div class="search-kbd"><kbd>/</kbd></div>
        <button class="btn btn-ghost btn-icon hidden" id="clearq"><svg width="14" height="14"><use href="#i-x"/></svg></button>
      </div>
      <div class="grow"></div>
      <select id="sort" style="width:auto">
        <option value="relevance">Best match</option>
        <option value="name">Name A to Z</option>
        <option value="date">Newest first</option>
        <option value="size">Largest first</option>
      </select>
      <div class="pop-wrap">
        <button class="btn" id="btn-kinds"><svg width="14" height="14"><use href="#i-layers"/></svg> Type<span id="kinds-n"></span></button>
        <div class="pop hidden" id="kinds-pop">
          <div class="pop-head"><span>File type</span><button class="btn btn-ghost btn-sm" id="kinds-clear">Clear</button></div>
          <div class="filter-chips" id="kind-chips"></div>
        </div>
      </div>
      <div class="seg">
        <button id="v-grid" class="on" title="Card view"><svg width="16" height="16"><use href="#i-grid"/></svg></button>
        <button id="v-list" title="List view"><svg width="16" height="16"><use href="#i-list"/></svg></button>
      </div>
      <button class="btn btn-primary owner-only" id="btn-share"><svg width="14" height="14"><use href="#i-share"/></svg> Share</button>
    </div>

    <div class="subbar">
      <nav class="crumbs" id="crumbs"></nav>
      <div class="grow"></div>
      <span class="count-pill" id="count"></span>
      <button class="btn btn-ghost btn-sm" id="btn-selall">Select all</button>
    </div>

    <div id="stage"></div>
  </main>
</div>

<div id="selbar" class="hidden">
  <span class="n"><b id="sel-n">0</b> selected</span>
  <button class="btn btn-sm" id="sel-download"><svg width="13" height="13"><use href="#i-download"/></svg> Download zip</button>
  <button class="btn btn-sm owner-only" id="sel-share"><svg width="13" height="13"><use href="#i-share"/></svg> Share folder</button>
  <button class="btn btn-ghost btn-sm btn-icon" id="sel-clear"><svg width="14" height="14"><use href="#i-x"/></svg></button>
</div>

<div id="viewer" class="hidden"></div>
<div id="modal-root"></div>
<div id="toasts"></div>

<input type="file" id="file-input" multiple class="hidden">
<input type="file" id="dir-input" webkitdirectory directory multiple class="hidden">

<script src="/search.js"></script>
<script src="/app.js"></script>
</body>
</html>
